# Render Blueprint for the FitFindr capstone (Path A).
# New → Blueprint → pick this repo. Render asks for GEMINI_API_KEY and DATABASE_URL.
services:
  - type: web
    name: fitfindr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Sync worker, one worker: see the note above _one_at_a_time in serve.py.
    # --timeout 120: a vision call plus a rate-limit wait can pass gunicorn's 30s default.
    startCommand: gunicorn serve:app --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: GEMINI_API_KEY
        sync: false
      # Postgres connection string (e.g. Neon). Without it the app falls back to
      # SQLite on Render's disk, which is wiped whenever the service sleeps.
      - key: DATABASE_URL
        sync: false
